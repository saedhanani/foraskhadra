# المرحلة 5.2: كل دفعة إلى main تُبنى وتُختبر (وحدات + تكامل على SQLite) — لا تحتاج SQL Server ولا أسرارًا.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Foras_Khadra.Tests/Foras_Khadra.Tests.csproj

      - name: Build
        run: dotnet build Foras_Khadra.Tests/Foras_Khadra.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Foras_Khadra.Tests/Foras_Khadra.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
