<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لا يوجد اتصال - فرص خضراء</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; background: #F6FBF7; color: #1F4824; }
        .box { text-align: center; padding: 32px 24px; max-width: 420px; }
        .box img { width: 120px; height: 120px; border-radius: 24px; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #4b5563; line-height: 1.8; }
        button { background: #25652C; color: #fff; border: 0; border-radius: 12px; padding: 12px 28px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        button:hover { background: #1F4824; }
        .en { direction: ltr; font-size: .9rem; color: #6b7280; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/images/icon-192.png" alt="فرص خضراء" />
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تعذّر الوصول إلى فرص خضراء الآن. تحقّق من اتصالك ثم أعد المحاولة.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        <p class="en">You're offline. Check your connection and try again.</p>
    </div>
</body>
</html>
